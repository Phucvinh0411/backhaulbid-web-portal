name: CD - Trigger Infra Deploy (Web Portal)

on:
  push:
    branches:
      - deploy
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'docs/**'

permissions:
  contents: read

jobs:
  dispatch-deploy:
    name: Dispatch Web Portal Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dispatch web-portal deploy to backhaulbid-infrastructure
        env:
          INFRA_DISPATCH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          REPO_NAME: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ -z "${INFRA_DISPATCH_TOKEN}" ]]; then
            echo "::error::Missing secret INFRA_DISPATCH_TOKEN (Fine-grained PAT with Contents: Read and write on Phucvinh0411/backhaulbid-infrastructure)."
            exit 1
          fi

          SHORT_SHA="$(git rev-parse --short HEAD)"
          echo "Dispatching services=web-portal, image_tag=${SHORT_SHA}, source_branch=deploy"

          curl -sS --fail-with-body -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${INFRA_DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Phucvinh0411/backhaulbid-infrastructure/dispatches \
            -d "{\"event_type\":\"deploy-services\",\"client_payload\":{\"services\":\"web-portal\",\"image_tag\":\"${SHORT_SHA}\",\"source_branch\":\"deploy\",\"triggered_by\":\"${REPO_NAME}@${SHORT_SHA}\"}}"
